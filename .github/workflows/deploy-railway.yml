name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rotem-poultry-n8n
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install a terminal helper
        run: apk add --no-cache util-linux

      - name: Save service settings before upload
        env:
          RAILWAY_SERVICE_CONFIG_SAVED: ${{ vars.RAILWAY_SERVICE_CONFIG_SAVED }}
        run: sh railway/persist-service-config.sh

      - name: Deploy to Railway production
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing RAILWAY_TOKEN repository secret."
            echo "Create a Project Token in Railway → Project Settings → Tokens,"
            echo "then add it as RAILWAY_TOKEN under GitHub → Settings → Secrets."
            exit 1
          fi
          # Wait for the Railway build and healthcheck. --detach made this job
          # green as soon as the upload finished, including when the new image
          # never replaced the running container.
          railway up \
            --service=rotem-poultry-n8n \
            --ci \
            -m "GitHub Actions deploy ${GITHUB_SHA}"
